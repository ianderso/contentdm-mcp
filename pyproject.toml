[project]
name = "contentdm-mcp"
dynamic = ["version"]
description = "MCP server for the record images and transcripts that US state archives and state libraries publish on OCLC's CONTENTdm: search one instance or a curated list of them, read an item and its pages, and download a page image. For genealogy and history."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Anderson" }]
keywords = ["mcp", "genealogy", "family-history", "archives", "contentdm", "iiif", "state-archives", "digital-collections", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Sociology :: Genealogy",
    "Topic :: Sociology :: History",
]
dependencies = [
    # Capped below 3: server.compact_schemas reaches into the SDK's private
    # tool registry, which a major release is free to change.
    "mcp>=2.0.0,<3",
    # Capped below 1, and httpcore named: client.PublicOnlyTransport wraps the
    # network backend inside httpx's connection pool, which is httpcore's and
    # private to httpx. A release that moves it fails construction, loudly.
    "httpx>=0.27,<1",
    "httpcore>=1.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # 6.0.1 is the first with wheels for Python 3.11 and 3.12; 6.0 needs a
    # Cython build that no longer works.
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # 0.9 is the oldest ruff whose formatter agrees with the committed style.
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/ianderso/contentdm-mcp"
Repository = "https://github.com/ianderso/contentdm-mcp"
Issues = "https://github.com/ianderso/contentdm-mcp/issues"
Changelog = "https://github.com/ianderso/contentdm-mcp/blob/main/CHANGELOG.md"

[project.scripts]
contentdm-mcp = "contentdm_mcp.__main__:main"

[build-system]
# 1.27 is the first hatchling to accept an SPDX string for `license`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/contentdm_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/contentdm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]
