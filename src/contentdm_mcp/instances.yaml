  terms: >-
    Mostly "In Copyright - Educational Use Permitted"; other uses need the
    contributing library's permission.

- key: nm-unm
  institution: New Mexico Digital Collections (University of New Mexico, with the New Mexico State Records Center and Archives)
  state: NM
  kind: university
  base_url: https://econtent.unm.edu
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 221
  holds: >-
    State Records Center and Archives collections (Adjutant General,
    Department of Corrections, Commission of Public Records); Catron land
