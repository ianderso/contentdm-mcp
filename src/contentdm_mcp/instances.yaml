  terms: State Library items are "No Copyright - United States".

- key: wa-wrh
  institution: Washington Rural Heritage (Washington State Library)
  state: WA
  kind: state library
  base_url: https://www.washingtonruralheritage.org
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 57
  holds: >-
    Local libraries' county heritage collections: photographs, oral
