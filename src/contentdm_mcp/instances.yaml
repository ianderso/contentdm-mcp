# CONTENTdm instances that hold US state and county records.
#
# Every `supported` entry answered dmGetCollectionList with JSON on the date
# in `checked`, and the collection count is what it answered then. Entries
# that are not supported say where the institution went, so a search can say
# so rather than come back empty.
#
# Fields
#   key          the name tools take as `instance`
#   institution  who runs the site (the holding institution of an item can be
#                another: aggregator sites carry contributors' collections)
#   state        two-letter postal code
#   kind         state archives | state library | state network | university
#   base_url     the public site, which is what item URLs and citations use
#   api_base     a second address for the same site, used for API and image
#                requests when the public host cannot be (see `note`)
#   platform     contentdm-classic | contentdm-new | quartex | islandora |
#                preservica | recollect | other
#   status       supported | moved | blocked
#   checked      the day this entry was verified live
#   collections  how many collections the site listed that day
#   holds        what is there for a genealogist, from its collection names
#   terms        what its rights statements say about reuse, where seen
#   moved_to     for a site that left CONTENTdm, where its material is now
#   note         anything else that changes how to use it
#
# Add an entry only after calling the site's API yourself. See CONTRIBUTING.md.

- key: al-adah
  institution: Alabama Department of Archives and History
  state: AL
  kind: state archives
  base_url: https://digital.archives.alabama.gov
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 68
  holds: >-
    1867 and 1875 voter registration books; World War I service records and
    Gold Star files; Alabama Supreme Court case files; incarceration records;
    governors' papers; Confederate regimental history files; letters and
    diaries, some with volunteer transcripts; Montgomery County Archives and
    other local contributors.
  terms: >-
    Items say they may be used for private study, scholarship or research;
    publication needs ADAH's use agreement.

- key: ga-vault
  institution: Georgia Archives (Virtual Vault)
  state: GA
  kind: state archives
  base_url: https://vault.georgiaarchives.org
  api_base: https://cdm17154.contentdm.oclc.org
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 53
  holds: >-
    Georgia death certificates; Confederate pension applications and
    enlistment oaths; colonial wills, conveyances and estate records; county
    and marriage records from microfilm; Wilkes County court and estate
    records; Chatham County deed books; headright and bounty plats; 1864
    militia enrollment lists; card indexes to the Archives' microfilm.
  terms: >-
    Items carry a "Cite as" line naming the record group; use it.
  note: >-
    vault.georgiaarchives.org sends an incomplete certificate chain, which
    Python's TLS refuses, so requests go to the site's OCLC address; item URLs
    keep the public one.

- key: tn-tsla
  institution: Tennessee State Library and Archives (Tennessee Virtual Archive, TeVA)
  state: TN
  kind: state archives
  base_url: https://teva.contentdm.oclc.org
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 82
  holds: >-
    Tennessee birth, delayed birth, death, marriage and divorce records and
    their annual indexes; World War I veterans' questionnaires and Gold Star
    records; Civil War military records; military muster rolls; Cherokee
    claims; Mount Olivet Cemetery records; early governors' papers.
  terms: >-
    Mostly "No Copyright - United States"; high-resolution copies are ordered
    from TSLA.
  note: >-
    The vital-records indexes are long compound objects whose "Transcript"
    field is machine OCR of each page: search them with page_hits=true.

- key: oh-memory
  institution: Ohio Memory (Ohio History Connection and State Library of Ohio)
  state: OH
  kind: state network
  base_url: https://ohiomemory.org
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 202
  holds: >-
    Ohio newspapers with OCR text; county records-centre collections (Greene,
    Licking); Cincinnati Federal Land Office records; the State Library's
    county atlases; obituary files; local libraries' and societies'
    collections.
  terms: >-
    Online access is for research only; reproduction requests go to the Ohio
    History Connection.

- key: il-ida
  institution: Illinois Digital Archives (Illinois State Library, Secretary of State)
  state: IL
  kind: state library
  base_url: https://www.idaillinois.org
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 265
  holds: >-
    Register of Illinois prison records; Madison County naturalization
    records; cemetery interment records; federal township plats; local
    newspapers and city directories contributed by Illinois libraries.
  terms: >-
    Copyright stays with each collection's owner; the State Library only
    displays it.

- key: in-isl
  institution: Indiana State Library (Indiana Memory)
  state: IN
  kind: state library
  base_url: https://indianamemory.contentdm.oclc.org
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 160
  holds: >-
    County public records (Adams County among them); selections from the
    Indiana Archives and Records Administration; the State Library's
    genealogy and newspaper collections; Sullivan County Civil War records;
    local libraries' and genealogical societies' collections.
  terms: >-
    Set by each contributor; many items are "No Copyright - United States".

- key: mo-mdh
  institution: Missouri Digital Heritage (Missouri State Archives and State Library)
  state: MO
  kind: state archives
  base_url: https://mdh.contentdm.oclc.org
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 189
  holds: >-
    Governors' records; Missouri Supreme Court reports; Missouri vital
    statistics; county histories and plat books; World War I biography and
    service records; newspapers.
  terms: >-
    Newspaper pages may be searched and displayed freely; publication needs
    permission.
  note: >-
    The State Archives' death certificates (1910 onward) and other indexes
    are separate databases on sos.mo.gov, not here.

- key: ky-kdl
  institution: Kentucky Digital Library (Kentucky Virtual Library)
  state: KY
  kind: state network
  base_url: https://kdl.kyvl.org
  api_base: https://cdm17244.contentdm.oclc.org
  platform: contentdm-classic
  status: supported
  checked: 2026-10-06
  collections: 60
  holds: >-
    Public libraries' newspaper and obituary indexes (the Louisville
    newspaper obituary index, 1918-1987; the Northern Kentucky newspaper
    index); local newspapers, photographs and yearbooks.
  terms: Set by each contributing library.
  note: >-
    kdl.kyvl.org sends an incomplete certificate chain, which Python's TLS
    refuses, so requests go to the site's OCLC address.

- key: ct-csl
  institution: Connecticut State Library
  state: CT
  kind: state library
  base_url: https://cslib.contentdm.oclc.org
